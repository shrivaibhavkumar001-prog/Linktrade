name: local_flow
description: "A hyper-local, community-driven marketplace app with multi-area price comparison and stock-market style price intelligence."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.6.0
  firebase_analytics: ^10.7.0

  # UI & Navigation
  go_router: ^12.0.0
  provider: ^6.0.0
  get: ^4.6.0

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  state_notifier: ^1.0.0

  # API & HTTP
  dio: ^5.3.0
  http: ^1.1.0
  connectivity_plus: ^5.0.0

  # Location & Maps
  geolocator: ^9.0.0
  google_maps_flutter: ^2.5.0
  latlong2: ^0.9.0

  # Payment
  razorpay_flutter: ^1.3.0
  upi_india: ^2.0.0

  # UI Components
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  permission_handler: ^11.4.0
  fl_chart: ^0.63.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^4.2.0

  # Voice & Audio
  speech_to_text: ^6.6.0
  record: ^5.0.0
  audio_service: ^0.18.0

  # Camera & Photo
  camera: ^0.10.5
  flutter_image_compress: ^2.1.0

  # Chat & Real-time
  firebase_database: ^10.4.0
  just_waveform: ^0.0.4

  # Date & Time
  intl: ^0.19.0
  date_format: ^2.0.0

  # Notifications
  flutter_local_notifications: ^14.1.0

  # Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # Utilities
  uuid: ^4.0.0
  http_parser: ^4.0.0
  validators: ^3.0.0
  crypto: ^3.0.0
  extension_google_maps_flutter_platform_interface: ^2.9.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Localization
  flutter_localization: ^0.1.13
  get_it: ^7.6.0

  # Analytics & Crash Reporting
  firebase_crashlytics: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/
    - .env
    - assets/localization/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
